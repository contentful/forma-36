version: 2.1

orbs:
  docker: circleci/docker@4.0.1
  node: circleci/node@7.2.1
  vault: contentful/vault@1.30.4

commands:
  configure-packages-read:
    steps:
      - vault/get-secrets:
          template-preset: packages-read
      - run: |
          echo "//npm.pkg.github.com/:_authToken=${GITHUB_PACKAGES_READ_TOKEN}" > ~/.npmrc
          echo "@contentful:registry=https://npm.pkg.github.com" >> ~/.npmrc
  install-packages:
    steps:
      - node/install-packages:
          pkg-manager: pnpm
          cache-path: ~/.local/share/pnpm/store

jobs:
  build:
    docker:
      - image: cimg/node:24.19.0-browsers
    resource_class: xlarge
    working_directory: ~/circleci-f36-build
    steps:
      - checkout
      - configure-packages-read
      - attach_workspace:
          at: ~/circleci-f36-build
      - install-packages
      - run:
          name: Build packages
          command: pnpm build --force
      - persist_to_workspace:
          root: .
          paths:
            - packages/components/**/dist
            - packages/core/dist
            - packages/f36-docs-utils/dist
            - packages/forma-36-react-components/dist
            - packages/forma-36-tokens/dist

  analyze_code:
    docker:
      - image: cimg/node:24.19.0
    resource_class: xlarge
    working_directory: ~/circleci-f36-build
    steps:
      - checkout
      - configure-packages-read
      - attach_workspace:
          at: ~/circleci-f36-build
      - install-packages
      - run:
          name: Prettier
          command: pnpm prettier:check
      - run:
          name: Lint
          command: pnpm lint
      - run:
          name: Check types
          command: pnpm tsc
      - run:
          name: Check dependencies
          command: pnpm exec knip

  test:
    docker:
      - image: cimg/node:24.19.0
    resource_class: xlarge
    working_directory: ~/circleci-f36-build
    steps:
      - checkout
      - configure-packages-read
      - attach_workspace:
          at: ~/circleci-f36-build
      - install-packages
      - run:
          name: Test
          command: pnpm test

  check-links:
    docker:
      - image: cimg/node:24.19.0-browsers
    resource_class: xlarge
    working_directory: ~/circleci-f36-build
    steps:
      - checkout
      - configure-packages-read
      - attach_workspace:
          at: ~/circleci-f36-build
      - install-packages
      - run:
          name: Build Next.js website
          command: pnpm docs:next:build
      - run:
          name: Run production version of the website locally
          command: pnpm docs:next:start-prod
          background: true
      - run:
          name: Wait for localhost:3000 to be ready
          command: pnpm exec wait-on http://localhost:3000
      - run:
          name: Run links checker
          command: pnpm --filter @contentful/f36-website check-links

  deploy_chromatic:
    docker:
      - image: cimg/node:24.19.0
    resource_class: xlarge
    working_directory: ~/circleci-f36-build
    steps:
      - checkout
      - configure-packages-read
      - attach_workspace:
          at: ~/circleci-f36-build
      - install-packages
      - run:
          name: Storybook
          command: pnpm storybook:build
      - run:
          name: Chromatic
          command: pnpm exec chromatic --only-changed  --project-token=${CHROMATIC_PROJECT_TOKEN} --exit-zero-on-changes --storybook-build-dir ./dist-storybook  --externals "scripts/.storybook/public/**"

  release:
    docker:
      - image: cimg/node:24.19.0
    working_directory: ~/circleci-f36-build
    resource_class: xlarge
    steps:
      - checkout
      - vault/get-secrets:
          template-preset: semantic-release
      - run: |
          echo "//npm.pkg.github.com/:_authToken=${GITHUB_PACKAGES_WRITE_TOKEN}" > ~/.npmrc
          echo "@contentful:registry=https://npm.pkg.github.com" >> ~/.npmrc
      - attach_workspace:
          at: ~/circleci-f36-build
      - add_ssh_keys:
          fingerprints:
            - 62:c1:53:b7:19:b8:35:4a:67:8c:58:c3:60:e0:68:11
      - install-packages
      - run: git config --global user.email ${GIT_AUTHOR_EMAIL}
      - run: git config --global user.name ${GIT_AUTHOR_NAME}
      - run:
          name: Generate changelogrc
          command: pnpm changelog:gen
      - run:
          name: Generate packages changelogs
          command: pnpm exec changeset version
      - run:
          name: Sync lockfile with version bumps
          command: pnpm install --no-frozen-lockfile
      - run:
          name: Publish packages and create releases
          command: |
            pnpm changeset:publish

  changelog:
    docker:
      - image: cimg/node:24.19.0
    resource_class: xlarge
    working_directory: ~/circleci-f36-build
    steps:
      - checkout
      - vault/get-secrets:
          template-preset: semantic-release
      - run: |
          echo "//npm.pkg.github.com/:_authToken=${GITHUB_PACKAGES_WRITE_TOKEN}" > ~/.npmrc
          echo "@contentful:registry=https://npm.pkg.github.com" >> ~/.npmrc
      - attach_workspace:
          at: ~/circleci-f36-build
      - add_ssh_keys:
          fingerprints:
            - 62:c1:53:b7:19:b8:35:4a:67:8c:58:c3:60:e0:68:11
      - install-packages
      - run: git config --global user.email ${GIT_AUTHOR_EMAIL}
      - run: git config --global user.name ${GIT_AUTHOR_NAME}
      - run:
          name: Generate changelog files
          command: pnpm changelog:write
      - run:
          name: Commit changelog files
          command: |
            git add . && pnpm pretty:quick
            git diff --staged --quiet || git commit -am "docs: update changelog on repository and website" && git push origin ${CIRCLE_BRANCH}

workflows:
  version: 2
  f36-build:
    jobs:
      - build:
          context:
            - vault
      - analyze_code:
          context:
            - vault
          requires:
            - build
      - test:
          context:
            - vault
          requires:
            - build
      - deploy_chromatic:
          context:
            - vault
          requires:
            - build
            - analyze_code
            - test
          filters:
            branches:
              # Forked pull requests have CIRCLE_BRANCH set to pull/XXX
              ignore: /pull\/[0-9]+/
      - release:
          requires:
            - build
            - analyze_code
            - test
          context:
            - vault
          filters:
            branches:
              only:
                - main
                - v5

  f36-link-checker:
    jobs:
      - build:
          context:
            - vault
      - check-links:
          context:
            - vault
          requires:
            - build

  f36-changelog:
    triggers:
      - schedule:
          cron: '30 1 * * *'
          filters:
            branches:
              only:
                - main
                - v5
    jobs:
      - changelog:
          context:
            - vault
