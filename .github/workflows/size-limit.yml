name: 'size'

on:
  pull_request:
    branches:
      - main

permissions:
  packages: read
  pull-requests: write

jobs:
  size:
    runs-on: ubuntu-latest
    env:
      CI_JOB_NUMBER: 1
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.18.1
      - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
      - name: Authenticate with Github packages
        run: |
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" > ~/.npmrc
          echo "@contentful:registry=https://npm.pkg.github.com" >> ~/.npmrc
      - name: Configure package manager for base comparison
        run: |
          cat > /tmp/package-manager <<'EOF'
          #!/bin/sh
          if [ -f pnpm-workspace.yaml ]; then
            exec pnpm "$@"
          fi
          if [ "$1" = install ]; then
            rm -rf node_modules packages/*/node_modules packages/components/*/node_modules
          fi
          exec npm "$@"
          EOF
          chmod +x /tmp/package-manager
      - uses: andresz1/size-limit-action@94bc357df29c36c8f8d50ea497c3e225c3c95d1d # v1.8.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          package_manager: /tmp/package-manager
