packages:
  - 'packages/*'
  - 'packages/components/*'

catalog:
  react: 19.2.8
  react-dom: 19.2.8

linkWorkspacePackages: true
autoInstallPeers: false

# DocSearch brings these Algolia peers transitively, but does not use them directly.
peerDependencyRules:
  ignoreMissing:
    - search-insights
    - '@algolia/client-search'
    - algoliasearch

# 15 days, matching the shared Renovate configuration.
minimumReleaseAge: 21600
minimumReleaseAgeExclude:
  - '@fastly/js-compute@3.44.3'
  - '@size-limit/file@13.0.1'
  - '@size-limit/preset-big-lib@13.0.1'
  - '@size-limit/time@13.0.1'
  - '@size-limit/webpack@13.0.1'
  # Renovate security update: @tiptap/core@3.30.4
  - '@tiptap/core@3.29.2 || 3.30.4'
  - '@tiptap/extension-bubble-menu@3.29.2'
  - '@tiptap/extension-document@3.29.2'
  - '@tiptap/extension-floating-menu@3.29.2'
  - '@tiptap/extension-mention@3.29.2'
  - '@tiptap/extension-paragraph@3.29.2'
  - '@tiptap/extension-text@3.29.2'
  - '@tiptap/extensions@3.29.2'
  - '@tiptap/pm@3.29.2'
  - '@tiptap/react@3.29.2'
  - '@tiptap/suggestion@3.29.2'
  - 'size-limit@13.0.1'
  # Renovate security update: next@15.5.21
  - next@15.5.21
  # Renovate security update: next-auth@4.24.15
  - next-auth@4.24.15
  # Renovate security update: qs@6.16.0
  - qs@6.16.0
ignoreScripts: true

overrides:
  '@emotion/eslint-plugin>eslint': '>=9.0.0'
  '@emotion/eslint-plugin>@typescript-eslint/utils': '^8.65.0'
  'eslint-plugin-import>eslint': '>=9.0.0'
  'eslint-plugin-jsx-a11y>eslint': '>=9.0.0'
  'eslint-plugin-react>eslint': '>=9.0.0'
